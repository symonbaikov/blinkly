<div class="p-card p-card-interactive" (click)="open.emit(prompt.id)"
     [style.display]="'flex'" [style.flex-direction]="'column'" [style.gap]="'14px'"
     [style.min-height]="compact ? 'auto' : '220px'" [style.position]="'relative'">

  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span class="tag tag-accent">
      <app-icon [name]="cat?.icon || 'doc'" [size]="12"></app-icon>
      {{ lang === 'ru' ? cat?.name : cat?.nameEn }}
    </span>
    <span class="tag">{{ levelLabel }}</span>
    <span *ngIf="prompt.premium" class="premium-badge">
      <app-icon name="lightning" [size]="10"></app-icon> {{ t.card_premium }}
    </span>
    <div style="flex:1"></div>
    <button (click)="$event.stopPropagation(); toggleFav.emit(prompt.id)"
      class="btn btn-ghost btn-sm"
      [style.padding]="'6px'"
      [style.color]="isFav ? 'var(--accent)' : 'var(--text-3)'"
      [title]="isFav ? t.card_saved : t.card_save">
      <app-icon name="bookmark" [size]="16"></app-icon>
    </button>
  </div>

  <h3 style="margin:0;font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-0.01em;text-wrap:balance">
    {{ title }}
  </h3>

  <p *ngIf="!compact" class="text-dim" style="margin:0;font-size:13px;line-height:1.5">
    {{ prompt.description }}
  </p>

  <div style="flex:1"></div>

  <div class="row" style="gap:12px;font-size:12px;color:var(--text-3);flex-wrap:wrap">
    <span class="row" style="gap:4px">
      <app-stars [value]="prompt.rating"></app-stars>
      <b [style.color]="'var(--text-2)'">{{ prompt.rating }}</b>
    </span>
    <span>·</span>
    <span>{{ formatUses() }} {{ t.card_uses }}</span>
    <div style="flex:1"></div>
    <div class="row" style="gap:4px">
      <span *ngFor="let llmId of (prompt.llm || []).slice(0,3)"
        [style.width]="'18px'" [style.height]="'18px'" [style.border-radius]="'4px'"
        [style.background]="getLlm(llmId)?.color"
        style="display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700"
        [title]="getLlm(llmId)?.name">
        {{ getLlmInitial(getLlm(llmId)) }}
      </span>
    </div>
  </div>

  <div style="display:flex;gap:8px">
    <button class="btn btn-sm" (click)="$event.stopPropagation(); copy.emit(prompt)" style="flex:1">
      <app-icon name="copy" [size]="13"></app-icon> {{ t.card_copy }}
    </button>
    <button class="btn btn-primary btn-sm" (click)="$event.stopPropagation(); open.emit(prompt.id)">
      {{ t.card_open }} <app-icon name="arrow" [size]="13"></app-icon>
    </button>
  </div>
</div>
